name: image
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      version:
        type: string
        required: true
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      OS: ${{ inputs.os }}
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.version }}-${{ github.run_number }}
      IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubernetes-sigs/image-builder
          ref: 7ffb9b7f1f26cd66891874463cc9411e3633325f # v0.1.55
          path: image-builder
          persist-credentials: false
      # image-builder prints its environment while building, so its steps get no token and signing is left to another job.
      - name: Build
        run: ./build.sh
      - name: Boot the image and run a cluster on it
        run: CNI=flannel ./smoke.sh && CNI=cilium ./smoke.sh
      - name: SBOM
        run: ./sbom.sh
      - name: Label
        run: |
          docker build -q --provenance=false -t "$IMAGE:$BUILD" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.description="Optimized CAPK worker node image for Hosted Control Plane architectures" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$BUILD" \
            - <<< "FROM $OS-container-disk"
      - name: Push
        if: github.ref == 'refs/heads/main'
        id: push
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$BUILD"
          ref=$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$BUILD")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "| $OS | $VERSION | \`$BUILD\` | \`${ref#*@}\` |" > row.md
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ inputs.os }}-${{ inputs.version }}
          path: |
            serial-*.log
            sbom.spdx.json
            grype.*
            row.md
          if-no-files-found: ignore
  attest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results-${{ inputs.os }}-${{ inputs.version }}
      - name: Log in to push the attestations
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      # Users of the moving tag must never see an image that cannot be verified
      - name: Verify and move the tag
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          for type in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            gh attestation verify "oci://$IMAGE@$DIGEST" --bundle-from-oci --predicate-type "$type" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/image.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          [[ $(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}') == "$DIGEST" ]]

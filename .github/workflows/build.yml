name: build
# No inputs: provenance does not record them, so the commit alone has to determine the build
on: workflow_dispatch
permissions: {}
concurrency: build-${{ github.ref }}
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-2404-minimal]
        version:
          - v1.37.2
          - v1.36.6
          - v1.35.10
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
  release:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./release.sh

name: build
on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: [ubuntu-2404-minimal, ubuntu-2604-minimal]
        default: ubuntu-2404-minimal
      version:
        description: Kubernetes version (e.g. v1.37.2)
        required: true
      publish:
        description: Push to GHCR
        type: boolean
        default: false
permissions: {}
concurrency: build-${{ inputs.os }}-${{ inputs.version }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      OS: ${{ inputs.os }}
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kubernetes-sigs/image-builder
          ref: 7ffb9b7f1f26cd66891874463cc9411e3633325f # v0.1.55
          path: image-builder
          persist-credentials: false
      # image-builder prints its environment while building, so its steps get no token and signing is left to another job.
      - name: Build
        run: ./build.sh
      - name: Boot the image and run a cluster on it
        run: ./smoke.sh
      - name: Label
        run: |
          docker build -q --provenance=false -t "$IMAGE:$VERSION" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.description="Optimized CAPK worker node image for Hosted Control Plane architectures" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            - <<< "FROM $OS-container-disk"
          docker inspect -f '{{json .Config.Labels}} {{len .RootFS.Layers}}' "$OS-container-disk" "$IMAGE:$VERSION"
      - name: Push
        if: inputs.publish
        id: push
        env:
          TOKEN: ${{ github.token }}
        run: |
          # $VERSION moves to the newest build, the dated tag stays
          dated=$IMAGE:$VERSION-$(date -u +%Y%m%d%H%M)
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$VERSION" "$dated"
          docker push "$dated"
          docker push "$IMAGE:$VERSION"
          ref=$(docker inspect -f '{{index .RepoDigests 0}}' "$dated")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serial-log
          path: serial.log
          if-no-files-found: ignore
  provenance:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Log in to push the attestation
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
  sbom:
    if: inputs.publish
    needs: build
    uses: ./.github/workflows/sbom.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      os: ${{ inputs.os }}
      version: ${{ inputs.version }}

name: build
# No inputs: provenance does not record them, so the commit alone has to determine the build
on: workflow_dispatch
permissions: {}
concurrency: build-${{ github.ref }}
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-2404-minimal]
        version:
          - v1.37.2
          - v1.36.6
          - v1.35.10
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}

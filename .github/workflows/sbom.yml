name: sbom
on:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: [ubuntu-2404-minimal, ubuntu-2604-minimal]
        default: ubuntu-2404-minimal
      version:
        description: Published Kubernetes version (e.g. v1.37.2)
        required: true
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      version:
        type: string
        required: true
permissions: {}
concurrency: sbom-${{ inputs.os }}-${{ inputs.version }}
jobs:
  # The scanners run without the token that signs
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.pull.outputs.digest }}
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull
        id: pull
        env:
          TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid version"; exit 1; }
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull -q "$IMAGE:$VERSION"
          docker logout ghcr.io
          ref=$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
      - name: Scan
        run: ./sbom.sh "$IMAGE:$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.os }}-${{ inputs.version }}
          path: |
            sbom.spdx.json
            grype.json
            grype.txt
  attest:
    needs: scan
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ inputs.os }}-${{ inputs.version }}
      - name: Log in to push the attestation
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.scan.outputs.image }}
          subject-digest: ${{ needs.scan.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
